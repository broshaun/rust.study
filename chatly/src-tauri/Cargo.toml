[package]
name = "app"
version = "0.1.0"
description = "Chatly"
authors = ["Shaun"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1.0"
tokio-util = "0.7.18"
tokio = { version = "1", features = ["full"] }
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
regex = "1"
pkcs8 = { version = "=0.11.0-rc.11" }
iroh = "0.97"
iroh-tickets = "0.4.0"
iroh-ping = "0.9.0"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
rumqttc = "0.25"
dashmap = "6"
xtra = { version = "0.6", features = ["tokio", "macros"] }
tauri-plugin-edge-to-edge = "0.3.3"
tauri-plugin-device-info = "1.0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

