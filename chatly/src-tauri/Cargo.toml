[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Shaun"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = ["protocol-asset"] }
tauri-plugin-http = "2.4.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
tokio-util = "0.7.18"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
  "sync",
] }

bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"

reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
regex = "1"

pkcs8 = { version = "=0.11.0-rc.11" }
iroh = "0.97"
iroh-tickets = "0.4.0"
iroh-ping = "0.9.0"

